<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <aside class="aside">
        <img
          src="img/photo-1585202900225-6d3ac20a6962.avif"
          alt="Folhas verdes"
          class="fundo"
        />
        <div class="logo-container"><img class="logo" src="img/odin-lined.png" alt="" />ODIN</div>
    </aside>

    <main class="main">
        <div class="alert">
            <h1>This is not a real online service! Do not put real informations in here. We don't have encryption!</h1>
        </div>
        <h1>Let's Do It!</h1>
       <div class="form">
  <form action="#" method="get" class="inputs">

    <div class="field">
      <label for="firstName">First Name:*</label>
      <input type="text" id="firstName" name="firstName" required placeholder="Your First Name">
    </div>

    <div class="field">
      <label for="lastName">Last Name:*</label>
      <input type="text" id="lastName" name="lastName" required placeholder="Your Last Name">
    </div>

    <div class="field">
      <label for="email">E-mail:*</label>
      <input type="email" id="email" name="email" required placeholder="Your E-mail">
    </div>

    <div class="field">
      <label for="phone">Phone</label>
      <input type="text" id="phone" name="phone" placeholder="Your Phone">
    </div>

    <div class="field">
      <label for="password">Password:*</label>
      <input type="password" id="password" name="password" required placeholder="Password">
    </div>

    <div class="field">
      <label for="confirmPassword">Confirm Password:*</label>
      <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Confirm Password">
      <div class="passwordAlert" id="passwordAlert">Passwords do not match!</div>
    </div>

    <button type="submit" class="create">Create Account</button>
  </form>
  <h3>Alredy have a Account? <a href="">Log In</a> </h3>
</div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
